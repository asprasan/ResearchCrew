site_name: ResearchCrew
site_url: https://asprasan.github.io/ResearchCrew
theme:
  name: material
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
plugins:
   - search
   - awesome-nav