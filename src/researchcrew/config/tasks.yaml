webcrawler_task:
  description: >
    Find the most relevant URLs for the user's request. Make sure to exclude
    websites with repetitive information and only consider freely accessible websites for scraping.
  expected_output: >
    A list of 5 URLs that are relevant to the user's request.
  agent: web_crawler

webscraper_task:
  description: >
    Extract the important information from the URLs provided by Web_crawler. 
    Make sure to understand the user's request and extract 
    the most relevant information from the web pages.
  expected_output: >
    For each URL provided by Web_crawler, extract the most relevant information that confirms to the user's request.
    The output should be a json object with keys 'url' and 'extracted_information'.
  agent: webscraper

research_task:
  description: >
    Summarize the information extracted by Webscraper and provide insights on the
    state of the market. Your summary will confirm to the user's request and provide insights on the state of the market.
    The current user's request is:
    {topic}
  expected_output: >
    The most relevant information extracted from each of the web pages.
  agent: researcher

reporting_task:
  description: >
    Review the context you got and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    The report should contain cite the URLs when there are non-trivial information that is extracted from the web pages.
    Formatted as markdown without '```'
  agent: reporting_analyst
